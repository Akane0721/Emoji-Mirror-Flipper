<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐氏表情包生成器</title>
<style>
    :root {
        --bg: #faebd7;
        --card: #fffdf9;
        --line: #e6d8c3;
        --text: #3a332b;
        --muted: #8a7f70;
        --accent: #d2691e;
        --accent-hi: #b8551a;
        --danger: #c0392b;
        --shadow: 0 2px 12px rgba(120, 90, 50, .12);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #211d18;
            --card: #2c2721;
            --line: #423a31;
            --text: #ede5d9;
            --muted: #9d9284;
            --accent: #e08a4a;
            --accent-hi: #f0a066;
            --danger: #e57368;
            --shadow: 0 2px 12px rgba(0, 0, 0, .35);
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 28px 20px 48px;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    h1 { margin: 0 0 24px; font-size: 1.6rem; text-align: center; }

    /* Drop zone */
    #drop {
        background: var(--card);
        border: 2px dashed var(--line);
        border-radius: 14px;
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
        box-shadow: var(--shadow);
    }
    #drop:hover, #drop.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
    #drop.hot { border-style: solid; }
    #drop .big { font-size: 2.2rem; line-height: 1; }
    #drop .hint { color: var(--muted); font-size: .85rem; margin-top: 6px; }
    #file { display: none; }

    /* Work area */
    #work { display: none; margin-top: 24px; }

    /* Control panel: one labelled row per group, parameters in their own row */
    .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 2px 18px;
        margin-bottom: 20px;
    }
    .row {
        display: grid;
        grid-template-columns: 3em 1fr;
        align-items: center;
        gap: 14px;
        padding: 11px 0;
    }
    .row + .row { border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
    .row.hide { display: none; }
    .rlabel {
        font-size: .74rem; letter-spacing: .12em;
        color: var(--muted); text-align: right; user-select: none;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    button {
        font: inherit;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        transition: background .15s, border-color .15s, color .15s;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    button.ghost { border-style: dashed; }

    /* Mode chips sit tighter than the action buttons below the panes */
    button.mode {
        padding: 6px 13px;
        font-size: .88rem;
        border-radius: 9px;
        background: transparent;
    }
    button.mode.on { background: var(--accent); }

    /* Effect chain */
    .chain { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chain:empty::after {
        content: '点上面的效果开始';
        color: var(--muted); font-size: .8rem;
    }
    .chip {
        font: inherit; font-size: .8rem;
        display: inline-flex; align-items: center; gap: 7px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
    }
    .chip.sel { border-color: var(--accent); color: var(--accent); }
    .chip .x { opacity: .45; font-size: .72rem; }
    .chip .x:hover { opacity: 1; color: var(--danger); }
    .arrow { color: var(--muted); opacity: .6; font-size: .8rem; }

    /* Both live at the far right of the pipeline row, and only one shows at a
       time, so the control in that corner stays put as the mode changes. */
    button.toggle, button.tiny {
        padding: 5px 11px; font-size: .8rem; border-radius: 8px;
        margin-left: auto;
    }
    button.toggle { border-style: dashed; }
    button.hide { display: none; }
    .chain.hide { display: none; }

    .ctl {
        display: inline-flex; align-items: center; gap: 7px;
        font-size: .82rem; color: var(--muted);
        padding-right: 4px;
    }
    .ctl.hide { display: none; }
    .ctl select {
        font: inherit; font-size: .85rem;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
    }
    .ctl select:focus-visible,
    .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ctl input[type="range"] { width: 104px; accent-color: var(--accent); cursor: pointer; }
    .ctl output {
        min-width: 3.4em; text-align: right;
        font-variant-numeric: tabular-nums; color: var(--text);
    }

    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 620px) { .panes { grid-template-columns: 1fr; } }
    .pane {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        box-shadow: var(--shadow);
        min-width: 0;
    }
    .pane h2 {
        margin: 0 0 10px; font-size: .8rem; font-weight: 600;
        letter-spacing: .06em; color: var(--muted);
        display: flex; align-items: center; justify-content: space-between;
    }
    .frame {
        display: flex; align-items: center; justify-content: center;
        min-height: 220px;
        /* Checkerboard backing so transparent areas are visible */
        background-image:
            linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%),
            linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
        border-radius: 8px;
        overflow: hidden;
    }
    .frame img { max-width: 100%; max-height: 340px; display: block; }
    .meta { margin-top: 10px; font-size: .78rem; color: var(--muted); text-align: center; word-break: break-all; }

    #spin { display: none; font-size: .85rem; color: var(--muted); }
    #spin.show { display: inline; }
    #err {
        display: none; margin-top: 16px; padding: 10px 14px;
        border-left: 3px solid var(--danger);
        background: color-mix(in srgb, var(--danger) 10%, var(--card));
        color: var(--danger); border-radius: 6px; font-size: .88rem;
    }
    #err.show { display: block; }
    .actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
    a.dl {
        font: inherit; text-decoration: none;
        padding: 9px 20px; border-radius: 999px;
        background: var(--accent); color: #fff;
        transition: background .15s;
    }
    a.dl:hover { background: var(--accent-hi); }
    a.dl.off { pointer-events: none; opacity: .4; }
</style>
</head>
<body>
<div class="wrap">
    <h1>唐氏表情包生成器</h1>

    <div id="drop">
        <div class="big">🫠</div>
        <div><strong>拖拽图片</strong>，或点击选择</div>
        <div class="hint">也可以直接 Ctrl+V 粘贴 · 支持 jpg / png / gif / webp · 最大 {{ max_mb }}MB</div>
        <input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp">
    </div>

    <div id="err"></div>

    <div id="work">
        <div class="panel">
            {% for group in mode_groups %}
            <div class="row">
                <span class="rlabel">{{ group.label }}</span>
                <div class="chips">
                    {% for key, label in group.modes %}
                    <button class="mode" data-mode="{{ key }}">{{ label }}</button>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}

            <!-- One slot that morphs: just the "stack" button normally, the
                 whole pipeline once stacking is on. Keeping it in the same row
                 means the button never jumps around. -->
            <div class="row" id="chainRow">
                <span class="rlabel" id="chainLabel"></span>
                <div class="chips">
                    <div class="chain hide" id="chainBox"></div>
                    <button class="toggle" id="stackBtn"
                            title="开启后，点击效果会追加到流程末尾，而不是替换掉现有的">＋ 叠加</button>
                    <button class="ghost tiny hide" id="clearBtn"
                            title="清空流程并退出叠加">清空</button>
                </div>
            </div>

            <div class="row hide" id="paramRow">
                <span class="rlabel">参数</span>
                <div class="chips">
                    <label class="ctl" id="countCtl">
                        <span id="countLabel">瓣数</span>
                        <select id="count"></select>
                    </label>
                    <label class="ctl" id="offsetCtl">
                        起始角
                        <input type="range" id="offset" min="0" max="{{ 360 - offset_step }}"
                               step="{{ offset_step }}" value="{{ default_offset }}">
                        <output id="offsetOut">{{ default_offset }}°</output>
                    </label>
                    <label class="ctl" id="twistCtl">
                        扭曲
                        <input type="range" id="twist" min="0" max="{{ max_twist }}"
                               step="{{ twist_step }}" value="{{ default_twist }}">
                        <output id="twistOut">{{ default_twist }}°</output>
                    </label>
                </div>
            </div>
        </div>

        <div class="panes">
            <div class="pane">
                <h2>原图</h2>
                <div class="frame"><img id="src" alt="原图"></div>
                <div class="meta" id="srcMeta"></div>
            </div>
            <div class="pane">
                <h2>结果 <span id="spin">处理中…</span></h2>
                <div class="frame"><img id="out" alt="结果" style="display:none"></div>
                <div class="meta" id="outMeta">选一个效果</div>
            </div>
        </div>

        <div class="actions">
            <a class="dl off" id="dl" download>下载</a>
            <button class="ghost" id="reset">重新选择</button>
        </div>
    </div>
</div>

<script>
const COUNTS_BY_MODE = {{ counts_by_mode | tojson }};
const DEFAULT_COUNT_BY_MODE = {{ default_count_by_mode | tojson }};
const COUNT_LABELS = {{ count_labels | tojson }};
const COUNT_UNITS = {{ count_units | tojson }};
const GRID_MODES = {{ grid_modes | tojson }};
const RADIAL_MODES = {{ radial_modes | tojson }};
const TWIST_MODES = {{ twist_modes | tojson }};
const MODE_LABELS = {{ mode_labels | tojson }};
const MAX_STEPS = {{ max_steps | tojson }};

const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), work = $('work'), err = $('err');
const srcImg = $('src'), outImg = $('out'), srcMeta = $('srcMeta'), outMeta = $('outMeta');
const dlLink = $('dl'), spin = $('spin'), paramRow = $('paramRow');
const countSelect = $('count'), countLabel = $('countLabel'), countCtl = $('countCtl');
const offsetInput = $('offset'), offsetOut = $('offsetOut'), offsetCtl = $('offsetCtl');
const twistInput = $('twist'), twistOut = $('twistOut'), twistCtl = $('twistCtl');
const chainBox = $('chainBox'), chainLabel = $('chainLabel');
const stackBtn = $('stackBtn'), clearBtn = $('clearBtn');
const modeButtons = [...document.querySelectorAll('.mode')];

const hasCount = (mode) => Object.prototype.hasOwnProperty.call(COUNTS_BY_MODE, mode);
const isRadial = (mode) => RADIAL_MODES.includes(mode);
const hasTwist = (mode) => TWIST_MODES.includes(mode);

let current = null;   // the current upload: {id, animated, ...}
let chain = [];       // the effect pipeline, applied in order
let selected = -1;    // which step the parameter controls are editing
let stacking = false; // when on, clicking a mode appends instead of replacing
let busy = false;

// Each mode allows a different set of counts: the kaleidoscope needs an even
// number, the pinwheel doesn't (so it offers 3 and 5), and the tiling counts
// repeats instead of segments. Rebuild the options per mode, keeping the
// current value whenever it is still valid.
function syncCountOptions(mode) {
    const allowed = COUNTS_BY_MODE[mode] || [];
    const fallback = DEFAULT_COUNT_BY_MODE[mode];
    const wanted = Number(countSelect.value);
    const keep = allowed.includes(wanted) ? wanted : fallback;
    countSelect.innerHTML = '';
    for (const n of allowed) {
        const opt = document.createElement('option');
        opt.value = String(n);
        opt.textContent = String(n);
        if (n === keep) opt.selected = true;
        countSelect.append(opt);
    }
    countLabel.textContent = COUNT_LABELS[mode] || '瓣数';
}

// Only show the controls the active mode actually uses; hide the whole
// parameter row when it uses none, so the panel doesn't carry dead widgets.
function syncControls(mode) {
    countCtl.classList.toggle('hide', !hasCount(mode));
    offsetCtl.classList.toggle('hide', !isRadial(mode));
    twistCtl.classList.toggle('hide', !hasTwist(mode));
    paramRow.classList.toggle('hide', !hasCount(mode));
    if (hasCount(mode)) syncCountOptions(mode);
}

syncCountOptions(RADIAL_MODES[0]);
syncControls(null);

// ---- the effect chain -----------------------------------------------------

function newStep(mode) {
    const step = { mode };
    if (hasCount(mode)) step.count = DEFAULT_COUNT_BY_MODE[mode];
    if (isRadial(mode)) step.offset = 0;
    if (hasTwist(mode)) step.twist = Number(twistInput.defaultValue);
    return step;
}

// Point the shared controls at one particular step
function loadControls(step) {
    syncControls(step.mode);
    if (hasCount(step.mode)) countSelect.value = String(step.count);
    if (isRadial(step.mode)) {
        offsetInput.value = String(step.offset);
        offsetOut.textContent = step.offset + '°';
    }
    if (hasTwist(step.mode)) {
        twistInput.value = String(step.twist);
        twistOut.textContent = step.twist + '°';
    }
}

function readControls(step) {
    if (hasCount(step.mode)) step.count = Number(countSelect.value);
    if (isRadial(step.mode)) step.offset = Number(offsetInput.value);
    if (hasTwist(step.mode)) step.twist = Number(twistInput.value);
}

function stepLabel(step) {
    let text = MODE_LABELS[step.mode];
    if (hasCount(step.mode)) {
        const n = step.count;
        text += GRID_MODES.includes(step.mode)
            ? ` ${n}×${n}${COUNT_UNITS[step.mode]}`
            : ` ${n}${COUNT_UNITS[step.mode]}`;
    }
    if (isRadial(step.mode) && step.offset) text += ` ${step.offset}°`;
    if (hasTwist(step.mode)) text += ` 扭${step.twist}°`;
    return text;
}

function renderChain() {
    chainBox.innerHTML = '';
    chain.forEach((step, i) => {
        if (i) {
            const arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '→';
            chainBox.append(arrow);
        }
        const chip = document.createElement('button');
        chip.className = 'chip' + (i === selected ? ' sel' : '');
        chip.dataset.index = String(i);
        const name = document.createElement('span');
        name.textContent = stepLabel(step);
        const kill = document.createElement('span');
        kill.className = 'x';
        kill.textContent = '✕';
        kill.title = '移除这一步';
        chip.append(name, kill);
        chip.addEventListener('click', (e) => {
            if (e.target === kill) removeStep(i);
            else selectStep(i);
        });
        chainBox.append(chip);
    });
    syncStackUI();
    // the mode buttons highlight whatever is in the chain
    modeButtons.forEach(b =>
        b.classList.toggle('on', chain.some(s => s.mode === b.dataset.mode)));
}

// Outside stacking mode the row carries nothing but the "stack" button; once
// stacking is on it becomes the pipeline, and the button in that same corner
// turns into "clear". Clearing is the only way out, so a visible pipeline and
// stacking mode always coincide.
function syncStackUI() {
    chainLabel.textContent = stacking ? '流程' : '';
    chainBox.classList.toggle('hide', !stacking);
    stackBtn.classList.toggle('hide', stacking);
    clearBtn.classList.toggle('hide', !stacking);
}

function selectStep(i) {
    selected = i;
    loadControls(chain[i]);
    renderChain();
}

function removeStep(i) {
    chain.splice(i, 1);
    if (!chain.length) {
        selected = -1;
        syncControls(null);
        renderChain();
        outImg.style.display = 'none';
        outMeta.textContent = '选一个效果';
        dlLink.classList.add('off');
        return;
    }
    selected = Math.min(selected, chain.length - 1);
    loadControls(chain[selected]);
    renderChain();
    runChain();
}

function pickMode(mode) {
    if (busy) return;
    if (!stacking || chain.length === 0) {
        chain = [newStep(mode)];
    } else if (chain.length < MAX_STEPS) {
        chain.push(newStep(mode));
    } else {
        showError(`最多叠加 ${MAX_STEPS} 个效果`);
        return;
    }
    clearError();
    selected = chain.length - 1;
    loadControls(chain[selected]);
    renderChain();
    runChain();
}

function showError(msg) {
    err.textContent = msg;
    err.classList.add('show');
}
function clearError() {
    err.classList.remove('show');
}
function setBusy(state) {
    busy = state;
    spin.classList.toggle('show', state);
    modeButtons.forEach(b => b.disabled = state);
    countSelect.disabled = state;
    offsetInput.disabled = state;
    twistInput.disabled = state;
}

async function upload(file) {
    if (!file) return;
    clearError();
    setBusy(true);
    const body = new FormData();
    body.append('file', file);

    try {
        const res = await fetch('/api/upload', { method: 'POST', body });
        // Flask may just drop the connection when the size limit is hit, so catch that here too
        const data = await res.json().catch(() => ({ ok: false, error: `上传失败（HTTP ${res.status}）` }));
        if (!data.ok) { showError(data.error); return; }

        current = data;
        srcImg.src = data.src_url;
        srcMeta.textContent = `${data.name} · ${data.width}×${data.height}`
            + (data.animated ? ` · ${data.frames} 帧` : '');
        outImg.style.display = 'none';
        outMeta.textContent = '选一个效果';
        dlLink.classList.add('off');
        chain = [];
        selected = -1;
        syncControls(null);
        renderChain();
        work.style.display = 'block';
    } catch (e) {
        showError('上传失败：' + e.message);
    } finally {
        setBusy(false);
    }
}

async function runChain() {
    if (!current || busy || !chain.length) return;
    clearError();
    setBusy(true);

    try {
        const res = await fetch('/api/flip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: current.id, steps: chain })
        });
        const data = await res.json().catch(() => ({ ok: false, error: `处理失败（HTTP ${res.status}）` }));
        if (!data.ok) { showError(data.error); return; }

        outImg.src = data.url;
        outImg.style.display = 'block';
        // Several modes crop to a centred square, so report the output size too
        let label = chain.map(stepLabel).join(' → ');
        if (data.width && data.height) label += ` · ${data.width}×${data.height}`;
        outMeta.textContent = label;
        dlLink.href = data.download_url;
        dlLink.classList.remove('off');
    } catch (e) {
        showError('处理失败：' + e.message);
    } finally {
        setBusy(false);
    }
}

// Click to pick a file
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    upload(fileInput.files[0]);
    fileInput.value = '';   // reset so picking the same file twice still fires
});

// Drag and drop
['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => upload(e.dataTransfer.files[0]));

// Paste from clipboard
document.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) upload(item.getAsFile());
});

modeButtons.forEach(b => b.addEventListener('click', () => pickMode(b.dataset.mode)));

stackBtn.addEventListener('click', () => {
    stacking = true;
    renderChain();
});

// Clearing is also how you leave stacking mode -- one button instead of two.
clearBtn.addEventListener('click', () => {
    chain = [];
    selected = -1;
    stacking = false;
    syncControls(null);
    renderChain();
    outImg.style.display = 'none';
    outMeta.textContent = '选一个效果';
    dlLink.classList.add('off');
    clearError();
});

// Editing a parameter writes back to the selected step, then re-runs the
// whole chain. Only fires when that step actually uses the parameter.
function editSelected(applies) {
    if (selected < 0 || !applies(chain[selected].mode)) return;
    readControls(chain[selected]);
    renderChain();
    runChain();
}
countSelect.addEventListener('change', () => editSelected(hasCount));

// 'input' fires continuously while dragging, so only track the readout there
// and wait for 'change' (pointer release) before hitting the server.
offsetInput.addEventListener('input', () => {
    offsetOut.textContent = offsetInput.value + '°';
});
offsetInput.addEventListener('change', () => editSelected(isRadial));

twistInput.addEventListener('input', () => {
    twistOut.textContent = twistInput.value + '°';
});
twistInput.addEventListener('change', () => editSelected(hasTwist));

$('reset').addEventListener('click', () => {
    current = null;
    chain = [];
    selected = -1;
    stacking = false;
    syncControls(null);
    renderChain();
    work.style.display = 'none';
    clearError();
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
